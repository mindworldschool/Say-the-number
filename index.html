<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta name="robots" content="noindex">
    <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-DVHX3G2VJV"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-DVHX3G2VJV', {

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Say the Number - MindWorld School</title>

    <!-- Иконка -->
    <link rel="icon" type="image/png" href="./assets/logo.png" />

    <!-- Общая оболочка публичных тренажёров: шапка, языки, шрифты, цвета -->
    <link rel="stylesheet" href="/trainer-shell/shell.v1.css" />
    <link rel="stylesheet" href="./styles.css?v=2" />
    <script src="/trainer-shell/shell.v1.js"></script>
  </head>

  <body>
    <!-- Сюда оболочка вставит шапку (лого, название, UA / EN / RU / ES) -->
    <div id="mw-header"></div>

    <main id="app" class="app-main" role="main"></main>

    <footer id="appFooter" class="app-footer">MindWorld School © 2026</footer>

    <!-- Шапка и язык — из общей оболочки: ?lang= → сохранённый выбор → браузер → украинский.
         Выбранный язык передаём в main.js через window.APP_LANG, смену — событием mw:langchange -->
    <script>
      MWShell.init({
        title: "Say the Number",
        tagline: {
          ua: "Розпізнавання чисел на абакусі",
          en: "Number Recognition on Abacus",
          ru: "Распознавание чисел на абакусе",
          es: "Reconocimiento de números en el ábaco"
        },
        docTitle: "Say the Number — MindWorld School",
        ukrainianCode: "ua",
        onLangChange: function (lang) { window.APP_LANG = lang; }
      });
    </script>

    <!-- Основной JS -->
    <script type="module" src="./main.js"></script>
  </body>
</html>
